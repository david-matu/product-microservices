spring.application.name: eureka

server.port: 8761

app:
 eureka-username: user
 eureka-password: pwd

eureka:
 instance:
  hostname: localhost
 client:
  registerWithEureka: false
  # registerWithEureka: false
  fetchRegistry: false
  serviceUrl:
   defaultZone: http://${app.eureka-username}:${app.eureka-password}@${eureka.instance.hostname}:${server.port}/eureka/
  
  # see: https://github.com/spring-cloud-samples/eureka/blob/master/src/main/resources/application.yml
 server:
  # wait-time-in-ms-when-sync-empty: 0
  waitTimeInMsWhenSyncEmpty: 0
  response-cache-update-interval-ms: 5000
   
management.endpoints.web.exposure.include: "*"