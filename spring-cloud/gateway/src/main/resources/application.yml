spring.application.name: gateway

app:
 auth-server: localhost
 eureka-server: eureka
 eureka-username: user
 eureka-password: pwd
 
# "http://${app.eureka-username}:${app.eureka-password}@${app.eureka-server}:8761/eureka/"
eureka:
 client:
  service-url:
   defaultZone: "http://user:pwd@${app.eureka-server}:8761/eureka/"
   initialInstanceInfoReplicationIntervalSeconds: 5
   registryFetchIntervalSeconds: 5
  
  instance:
   leaseRenewalIntervalInSeconds: 5
   leaseExpirationDurationInSeconds: 5
   metadata-map:
      username: user
      password: pwd
  

management.endpoint.gateway.enabled: true 
management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"

logging:
  level:
    root: INFO
    '[org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator]': INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: TRACE
    
spring.cloud.gateway.routes: 
- id: product-composite
  uri: lb://product-composite
  predicates:
  - Path=/product-composite/**

- id: product-composite-swagger-ui
  uri: lb://product-composite
  predicates:
  - Path=/openapi/**

- id: oauth2-server
  uri: lb://auth-server
  predicates:
  - Path=/oauth2/**

- id: oauth2-login
  uri: lb://auth-server
  predicates:
  - Path=/login/**

- id: oauth2-error
  uri: lb://auth-server
  predicates:
  - Path=/error/**

- id: eureka-api
  uri: "http://${app.eureka-username}:${app.eureka-password}@${app.eureka-server}:8761"
  predicates:
  - Path=/eureka/api/{segment}
  filters:
  - SetPath=/eureka/{segment}

- id: eureka-web-start
  uri: http://${app.eureka-username}:${app.eureka-password}@${app.eureka-server}:8761
  predicates:
  - Path=/eureka/web
  filters:
  - SetPath=/
  
- id: eureka-web-other
  uri: http://${app.eureka-username}:${app.eureka-password}@${app.eureka-server}:8761
  predicates:
  - Path=/eureka/**

- id: config-server
  uri: http://${app.config-server}:8888
  predicates:
  - Path=/config/**
  filters:
  - RewritePath=/config/(?<segment>.*), /$\{segment}

- id: host_route_200
  uri: http://httpstat.us
  predicates:
  - Host=i.feel.lucky:8080
  - Path=/headerrouting/**
  filters:
  - SetPath=/200

server.port: 8443
server.ssl:
   key-store-type: PKCS12
   key-store: classpath:keystore/edge.p12
   key-store-password: root35
   key-alias: localhost

# spring.security.oauth2.resourceserver.jwt.issuer-uri: http://${app.auth-server}:9999 
spring.security.oauth2.resourceserver.jwt.issuer-uri: https://dev-ww47b0brrhicfeqm.us.auth0.com/


