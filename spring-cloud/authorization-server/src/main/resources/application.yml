#spring.config.import: "configserver:"
spring.config.import: "configserver:http://${spring.cloud.config.username}:${spring.cloud.config.password}@config-server:8888"

spring:
 application.name: auth-server
 cloud.config:
  failFast: true
  retry:
   initial-interval: 3000
   multiplier: 1.3
   max-interval: 10000
   max-attempts: 3
  uri: http://localhost:8888
  username: ${CONFIG_SERVER_USR}
  password: ${CONFIG_SERVER_PWD}
  
# debug: true

logging:
  level:
    root: INFO

---
spring.config.activate.on-profile: docker

spring.cloud.config.uri: http://${CONFIG_SERVER_USR}:${CONFIG_SERVER_PWD}@config-server:8888