# version: '2.1'

services:
  product:
    build: microservices/product-service
    mem_limit: 512m
    # ports:
      # - "7001:8080"
    environment:
     - SPRING_PROFILES_ACTIVE=docker
     - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
     - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}

    depends_on:
     mongodb:
      condition: service_healthy
     rabbitmq:
      condition: service_healthy
  
  recommendation:
    build: microservices/recommendation-service
    mem_limit: 512m
    # ports:
      # - "7002:8080"
    environment:
     - SPRING_PROFILES_ACTIVE=docker
     - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
     - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
    depends_on:
     mongodb:
      condition: service_healthy
     rabbitmq:
      condition: service_healthy

  review:
    build: microservices/review-service
    mem_limit: 512m
    # ports:
      # - "7003:8080"
    environment:
     - SPRING_PROFILES_ACTIVE=docker
     - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
     - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
    depends_on:
     mysql:
      condition: service_healthy
     rabbitmq:
      condition: service_healthy

  product-composite:
    build: microservices/product-composite-service
    mem_limit: 512m
    # ports:
      # - "8080:8080"
    environment:
     - SPRING_PROFILES_ACTIVE=docker
     - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
     - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
    depends_on:
     rabbitmq:
      condition: service_healthy
      
  mongodb:
   image: mongo:6.0.4
   mem_limit: 512m
   ports:
    - "27017:27017"
   command: mongod
   healthcheck:
    test: "mongostat -n 1"
    interval: 5s
    timeout: 2s
    retries: 60

  mysql:
   image: mysql:8.0.32
   mem_limit: 512m
   ports:
    - "3306-3306"
   environment:
    - MYSQL_ROOT_PASSWORD=mypwd
    - MYSQL_DATABASE=review_db
    - MYSQL_USER=user
    - MYSQL_PASSWORD=mypwd
   healthcheck:
    test: "/usr/bin/mysql --user=user --password=mypwd --execute \"SHOW DATABASES;\""
    interval: 5s
    timeout: 2s
    retries: 60

  rabbitmq:
   image: rabbitmq:3.11.8-management
   mem_limit: 512m
   ports:
    - 5672:5672
    - 15672:15672
   healthcheck:
    test: ["CMD", "rabbitmqctl", "status"]
    interval: 5s
    timeout: 2s
    retries: 60
    
  eureka:
   build: spring-cloud/eureka-server
   mem_limit: 512m
   ports:
    - "8761:8761"
   environment: 
    - SPRING_PROFILES_ACTIVE=docker
    - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
    - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
   depends_on:
    config-server:
     condition: service_started
      
  gateway:
   environment:
    - SPRING_PROFILES_ACTIVE=docker
    - SERVER_SSL_KEYSTORE=file:/keystore/edge-test.p12
    - SERVER_SSL_KEY_STORE_PASSWORD=root35Dav
    # - SERVER_SSL_KEYSTORE_PASSWORD=root35Dav
    - APP_EUREKA_SERVER=eureka
    - APP_AUTH_SERVER=auth-server
    - APP_CONFIG_SERVER=config-server
    - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://dev-ww47b0brrhicfeqm.us.auth0.com/
    - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
    - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
   volumes:
    - $PWD/keystore:/keystore
   build: spring-cloud/gateway
   mem_limit: 512m
   ports:
    - "8443:8443"
    # - "8080:8080"
   depends_on:
    eureka:
     condition: service_started
     
  auth-server:
   environment:
    - SPRING_PROFILES_ACTIVE=docker
    - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
    - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
   build: spring-cloud/authorization-server
   mem_limit: 512m
   healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:9999/actuator/health"]
    interval: 5s
    timeout: 2s
    retries: 60
   depends_on:
    config-server:
     condition: service_started


  config-server:
   build: spring-cloud/config-server
   mem_limit: 512m
   ports:
    - "8888:8888"
   environment:
    - SPRING_PROFILES_ACTIVE=docker,native
    - ENCRYPT_KEY=${CONFIG_SERVER_ENCRYPT_KEY}
    - SPRING_SECURITY_USER_NAME=${CONFIG_SERVER_USR}
    - SPRING_SECURITY_USER_PASSWORD=${CONFIG_SERVER_PWD}
   volumes:
    - $PWD/config-repo:/config-repo
    

    
     
     
